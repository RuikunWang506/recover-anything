name: release

# Publishes to PyPI when a version tag (v0.1.0, v0.2.0, ...) is pushed. Tag a
# commit whose tests passed. PyPI must trust this workflow first (Trusted
# Publishing: no password or token is stored in the repo): see docs/HANDOFF.md.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the tag matches the version in pyproject.toml
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "pyproject.toml says $v, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - name: the wheel installs and runs
        run: |
          python -m pip install dist/*.whl
          recover-anything --version
          recover-anything --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets PyPI check this run is the trusted workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
