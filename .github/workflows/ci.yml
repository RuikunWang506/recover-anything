name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs
        env:
          RA_DIAG: ${{ github.workspace }}/guard-diag.txt
      - name: save guard on real disk images (details)
        if: always() && runner.os != 'Linux'
        shell: bash
        run: cat "$GITHUB_WORKSPACE/guard-diag.txt" || echo "no details recorded"
      - name: selftest (quick)
        run: recover-anything selftest --quick
