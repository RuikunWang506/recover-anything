name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs
        env:
          RA_DIAG: ${{ github.workspace }}/guard-diag.txt
      - name: save guard on real disk images (details)
        if: always() && runner.os != 'Linux'
        shell: bash
        run: cat "$GITHUB_WORKSPACE/guard-diag.txt" || echo "no details recorded"
      - name: selftest (quick)
        run: recover-anything selftest --quick
      - name: NTFS reader on a real NTFS volume (mkntfs, ntfs-3g)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y -qq ntfs-3g
          sudo -E env "PATH=$PATH" python -m pytest -q -rs tests/test_ntfs_real.py

  package:
    # What a release would upload: it builds, and the wheel installs and runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: the wheel installs and runs
        run: |
          python -m pip install dist/*.whl
          recover-anything --version
          recover-anything --help
