[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recover-anything"
version = "0.1.0"
description = "Get back deleted and formatted photos, videos and files, safely. Rebuilds fragmented photos, keeps original names, never writes to the card. Built for AI agents and humans."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ruikun Wang"}]
keywords = ["data recovery", "photo recovery", "sd card", "undelete", "file carving", "forensics", "ai agent", "claude code", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Recovery Tools",
    "Topic :: System :: Filesystems",
]
dependencies = []

[project.optional-dependencies]
full = ["Pillow>=9"]
dev = ["pytest>=7", "Pillow>=9"]

[project.urls]
Homepage = "https://github.com/RuikunWang506/recover-anything"
Issues = "https://github.com/RuikunWang506/recover-anything/issues"

[project.scripts]
recover-anything = "recover_anything.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recover_anything = ["skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
